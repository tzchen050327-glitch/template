<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#d9a441">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Reels 封面產生器</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #f5f5f5;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 14px;
    }

    h1 {
      font-size: 22px;
      margin: 8px 0 12px;
      letter-spacing: 1px;
    }

    .panel {
      background: #1d1d1d;
      border: 1px solid #333;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #bbb;
      margin: 8px 0 5px;
    }

    input[type="text"], input[type="date"] {
      width: 100%;
      height: 42px;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 0 12px;
      background: #101010;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    input[type="file"] {
      width: 100%;
      color: #ddd;
      font-size: 14px;
      margin: 6px 0;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      width: 100%;
      height: 44px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(135deg, #d9a441, #fff0a4);
      color: #151515;
    }

    .secondary {
      background: #2c2c2c;
      color: #fff;
      border: 1px solid #444;
    }

    .canvasWrap {
      width: 100%;
      aspect-ratio: 9 / 16;
      background: #000;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid #3a3a3a;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #000;
    }

    .hint {
      font-size: 12px;
      color: #999;
      line-height: 1.5;
      margin-top: 8px;
    }

    #installAppBtn {
      position: fixed;
      right: 16px;
      bottom: 18px;
      z-index: 9999;
      width: auto;
      min-width: 132px;
      padding: 0 18px;
      background: linear-gradient(135deg, #d9a441, #fff0a4);
      color: #151515;
      border: 1px solid rgba(255,255,255,0.35);
      box-shadow: 0 8px 24px rgba(0,0,0,0.35);
      display: none;
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>Reels 封面產生器</h1>

    <section class="panel">
      <label>上傳照片</label>
      <input id="imageInput" type="file" accept="image/*" />

      <label>主標題</label>
      <input id="titleInput" type="text" value="今日精選" placeholder="輸入主標題" />

      <label>副標題</label>
      <input id="subtitleInput" type="text" value="REELS COVER" placeholder="輸入副標題" />

      <div class="row">
        <div>
          <label>日期</label>
          <input id="dateInput" type="date" />
        </div>
        <div>
          <label>右下角品牌字</label>
          <input id="brandInput" type="text" value="我的中職棒球之旅" />
        </div>
        <label>模板顏色</label>
<input
  id="frameColor"
  type="color"
  value="#d9a441"
  style="
    width:100%;
    height:42px;
    border:none;
    border-radius:10px;
    background:#101010;
    cursor:pointer;
  "
/>
      </div>

      <div class="row" style="margin-top: 12px;">
        <button class="secondary" id="resetBtn">重設位置</button>
        <button class="primary" id="downloadBtn">下載 PNG</button>
      </div>

      <div class="hint">手機可用手指拖曳照片；雙指縮放。輸出尺寸固定為 1080×1920。</div>
    </section>

    <section class="canvasWrap" id="canvasWrap">
      <canvas id="coverCanvas" width="1080" height="1920"></canvas>
    </section>
  </main>

  <button id="installAppBtn" type="button">安裝 App</button>

  <script>
    const canvas = document.getElementById('coverCanvas');
    const ctx = canvas.getContext('2d');

    const imageInput = document.getElementById('imageInput');
    const titleInput = document.getElementById('titleInput');
    const subtitleInput = document.getElementById('subtitleInput');
    const dateInput = document.getElementById('dateInput');
    const brandInput = document.getElementById('brandInput');
    const frameColor = document.getElementById('frameColor');
    const resetBtn = document.getElementById('resetBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const installAppBtn = document.getElementById('installAppBtn');

    let deferredInstallPrompt = null;

    function isRunningAsPWA() {
      return window.matchMedia('(display-mode: standalone)').matches ||
             window.matchMedia('(display-mode: fullscreen)').matches ||
             window.navigator.standalone === true;
    }

    function updateInstallButton() {
      installAppBtn.style.display = isRunningAsPWA() ? 'none' : 'block';
    }

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      deferredInstallPrompt = event;
      updateInstallButton();
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      installAppBtn.style.display = 'none';
    });

    installAppBtn.addEventListener('click', async () => {
      if (isRunningAsPWA()) {
        installAppBtn.style.display = 'none';
        return;
      }

      if (deferredInstallPrompt) {
        deferredInstallPrompt.prompt();
        await deferredInstallPrompt.userChoice;
        deferredInstallPrompt = null;
        updateInstallButton();
        return;
      }

      alert('瀏覽器目前尚未提供安裝視窗。請用 Chrome 開啟本頁，稍後再按一次；若選單中已出現「安裝應用程式」，也可以直接使用該選項。');
    });

    updateInstallButton();

    const W = 1080;
    const H = 1920;

    let img = null;
    let imgX = 0;
    let imgY = 0;
    let imgScale = 1;
    let baseScale = 1;

    let dragging = false;
    let lastX = 0;
    let lastY = 0;
    let lastPinchDistance = 0;

    dateInput.valueAsDate = new Date();

    function formatDate(value) {
      if (!value) return '';
      const [y, m, d] = value.split('-');
      return `${y}.${m}.${d}`;
    }

    function fitImage() {
      if (!img) return;
      baseScale = Math.max(W / img.width, H / img.height);
      imgScale = baseScale;
      imgX = (W - img.width * imgScale) / 2;
      imgY = (H - img.height * imgScale) / 2;
      draw();
    }

    function drawRoundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.lineTo(x + w - r, y);
      ctx.quadraticCurveTo(x + w, y, x + w, y + r);
      ctx.lineTo(x + w, y + h - r);
      ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      ctx.lineTo(x + r, y + h);
      ctx.quadraticCurveTo(x, y + h, x, y + h - r);
      ctx.lineTo(x, y + r);
      ctx.quadraticCurveTo(x, y, x + r, y);
      ctx.closePath();
    }

    function drawTemplate() {
      // 暗色遮罩，讓文字更清楚
      const topGradient = ctx.createLinearGradient(0, 0, 0, 620);
      topGradient.addColorStop(0, 'rgba(0,0,0,0.72)');
      topGradient.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = topGradient;
      ctx.fillRect(0, 0, W, 620);

      const bottomGradient = ctx.createLinearGradient(0, H - 680, 0, H);
      bottomGradient.addColorStop(0, 'rgba(0,0,0,0)');
      bottomGradient.addColorStop(1, 'rgba(0,0,0,0.82)');
      ctx.fillStyle = bottomGradient;
      ctx.fillRect(0, H - 680, W, 680);

      // 金色外框
      ctx.strokeStyle = frameColor.value;
      ctx.lineWidth = 12;
      drawRoundedRect(44, 44, W - 88, H - 88, 44);
      ctx.stroke();

      ctx.strokeStyle = 'rgba(255,255,255,0.35)';
      ctx.lineWidth = 2;
      drawRoundedRect(70, 70, W - 140, H - 140, 32);
      ctx.stroke();

      // 上方小標籤
      ctx.fillStyle = frameColor.value;
      drawRoundedRect(92, 105, 270, 58, 29);
      ctx.fill();
      ctx.fillStyle = '#121212';
      ctx.font = 'bold 30px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('REELS COVER', 227, 134);

      // 日期
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = '500 32px system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(formatDate(dateInput.value), W - 92, 134);

      // 主標題背景
      ctx.fillStyle = 'rgba(0,0,0,0.48)';
      drawRoundedRect(86, H - 430, W - 172, 250, 28);
      ctx.fill();

      // 主標題
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'left';
      ctx.textBaseline = 'alphabetic';
      ctx.font = 'bold 96px system-ui, sans-serif';
      wrapText(titleInput.value || '輸入標題', 118, H - 305, W - 236, 104);

      // 副標題
      ctx.fillStyle = frameColor.value;
      ctx.font = 'bold 42px system-ui, sans-serif';
      ctx.fillText(subtitleInput.value || '', 118, H - 205);

      // 品牌
      ctx.fillStyle = 'rgba(255,255,255,0.9)';
      ctx.font = 'bold 34px system-ui, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(brandInput.value || '', W - 92, H - 92);
    }

    function wrapText(text, x, y, maxWidth, lineHeight) {
      const chars = [...text];
      let line = '';
      let lines = [];

      for (const ch of chars) {
        const testLine = line + ch;
        if (ctx.measureText(testLine).width > maxWidth && line) {
          lines.push(line);
          line = ch;
        } else {
          line = testLine;
        }
      }
      lines.push(line);

      lines.slice(0, 2).forEach((l, i) => {
        ctx.fillText(l, x, y + i * lineHeight);
      });
    }

    function drawPlaceholder() {
      const gradient = ctx.createLinearGradient(0, 0, W, H);
      gradient.addColorStop(0, '#222');
      gradient.addColorStop(0.5, '#111');
      gradient.addColorStop(1, '#2a210f');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, W, H);

      ctx.fillStyle = 'rgba(255,255,255,0.25)';
      ctx.font = 'bold 56px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('上傳照片套用封面模板', W / 2, H / 2);
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);

      if (img) {
        ctx.drawImage(img, imgX, imgY, img.width * imgScale, img.height * imgScale);
      } else {
        drawPlaceholder();
      }

      drawTemplate();
    }

    imageInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = () => {
        img = new Image();
        img.onload = fitImage;
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });

    [titleInput, subtitleInput, dateInput, brandInput, frameColor].forEach(input => {
      input.addEventListener('input', draw);
      input.addEventListener('change', draw);
    });

    resetBtn.addEventListener('click', fitImage);

    downloadBtn.addEventListener('click', () => {
      draw();
      const link = document.createElement('a');
      link.download = 'reels-cover-1080x1920.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });

    canvas.addEventListener('pointerdown', (e) => {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!dragging || !img) return;
      const rect = canvas.getBoundingClientRect();
      const scaleX = W / rect.width;
      const scaleY = H / rect.height;
      imgX += (e.clientX - lastX) * scaleX;
      imgY += (e.clientY - lastY) * scaleY;
      lastX = e.clientX;
      lastY = e.clientY;
      draw();
    });

    canvas.addEventListener('pointerup', () => dragging = false);
    canvas.addEventListener('pointercancel', () => dragging = false);

    // 手機雙指縮放
    canvas.addEventListener('touchmove', (e) => {
      if (!img || e.touches.length !== 2) return;
      e.preventDefault();

      const t1 = e.touches[0];
      const t2 = e.touches[1];
      const dist = Math.hypot(t1.clientX - t2.clientX, t1.clientY - t2.clientY);

      if (!lastPinchDistance) {
        lastPinchDistance = dist;
        return;
      }

      const oldScale = imgScale;
      imgScale *= dist / lastPinchDistance;
      imgScale = Math.max(baseScale * 0.6, Math.min(imgScale, baseScale * 4));

      const rect = canvas.getBoundingClientRect();
      const centerX = ((t1.clientX + t2.clientX) / 2 - rect.left) * (W / rect.width);
      const centerY = ((t1.clientY + t2.clientY) / 2 - rect.top) * (H / rect.height);

      imgX = centerX - (centerX - imgX) * (imgScale / oldScale);
      imgY = centerY - (centerY - imgY) * (imgScale / oldScale);

      lastPinchDistance = dist;
      draw();
    }, { passive: false });

    canvas.addEventListener('touchend', () => {
      lastPinchDistance = 0;
    });

    draw();
  </script>
</body>
</html>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./service-worker.js');
}
</script>
